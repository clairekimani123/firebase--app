    <div id="register" class="pb-5 bg-light">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-6">
                    <div class="card shadow-lg border-0">
                        <div class="card-body p-5">
                            <h2 class="text-center mb-4" style="color: var(--primary-blue)">Register</h2>
                            <form>
                                <div class="form-group mb-3">
                                    <label>Username</label>
                                    <input type="text" required class="form-control" placeholder="Enter username">
                                </div>
                                <div class="form-group mb-3">
                                    <label>Email Address</label>
                                    <input type="email" required class="form-control" placeholder="Enter email">
                                </div>
                                <div class="form-group mb-3">
                                    <label>Password</label>
                                    <input type="password" required class="form-control" placeholder="Enter password">
                                </div>
                                <div class="form-group mb-4">
                                    <label>Confirm Password</label>
                                    <input type="password" required class="form-control" placeholder="Repeat password">
                                </div>
                                <div class="form-group checkbox-field mb-4">
                                    <label class="small text-muted">
                                        <input type="checkbox" required> I agree to the <i>terms</i> and <i>privacy policy</i>.
                                    </label>
                                </div>
                                <div class="text-center">
                                  <button type="submit" class="btn-text" onclick="window.location.href='index.html'; return false;">Register Now</button>
                                </div>
                            </form>
                            <div class="mt-4 text-center">
                                <p class="small text-muted">Already have an account? <a href="login.html">Login here</a></p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
